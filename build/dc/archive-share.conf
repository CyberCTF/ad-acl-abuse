
# The flag lives here. Only b.whitfield (and Domain Admins) may open the share, so the flag
# is reachable only once control of b.whitfield has been seized through the GenericAll ACE.
[archive]
   path = /srv/archive
   read only = yes
   browseable = yes
   valid users = VERTEX\b.whitfield, @"VERTEX\Domain Admins"
