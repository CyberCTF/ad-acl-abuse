
# The flag lives here. Only maester.luwin (and Domain Admins) may open the share, so the flag
# is reachable only once control of maester.luwin has been seized through the GenericAll ACE.
[archive]
   path = /srv/archive
   read only = yes
   browseable = yes
   valid users = NORTH\maester.luwin, @"NORTH\Domain Admins"
